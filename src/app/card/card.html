@if (weatherData()?.daily) {
    <div id="card-div">
        <h3>{{ weatherCode() }}</h3>
        @if (precProb() == null) {
            <p>N/A</p>
        }
        @else {
            <p>{{ precProb() }} %</p> 
        }
        <p>{{ maxTemperature() }} °C, {{ minTemperature() }} °C</p>
    </div>

    <p>{{ weekDate() | date:'dd/MM' }}</p>
}
