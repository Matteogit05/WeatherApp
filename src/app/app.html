<header>
    <div id="header-container">
        <div class="box-hd">
            <p id="p-title">WeatherApp</p>
        </div>
        <div class="box-hd">
            <p>Location: {{ la() }}, {{ lo() }}</p>
        </div>
    </div>
</header>

<div id="container-header">
    <div class="box-header">
        <h1>Welcome</h1>
    </div>
    <div class="box-header">
        <img id="hero-image" src="/undraw_weather-app_4cp0.svg">
    </div>
</div>

<div class="maindiv">
    <app-weather-component [lat]="la()" [lon]="lo()" />
</div>

<div class="maindiv">
    <button id="modal-button" (click)="openModal()">Insert coordinates</button>
</div>
