<header>
    <div id="header-container">
        <div class="box-hd">
            <p id="p-title"><a routerLink="/">WeatherApp</a></p>
        </div>
        <div class="box-hd" id="box-hd-right">
            <p id="coord-header">Location: {{ latitude() }}, {{ longitude() }}</p>
            <button id="edit-coord-header" (click)="openModal()">Edit</button>
        </div>
    </div>
</header>

<router-outlet />

<div id="attribution-container"><a href="https://open-meteo.com" id="attribution">Weather Data by open-meteo.com</a></div>
<footer>
  <div id="footer-container">
    <a class="footer-element" href="https://github.com/MatteoGit05/WeatherApp">GitHub</a>
    <p class="footer-element" matTooltip="
      The icons in this app come from Flaticon (flaticon.com).
      Images come from Undraw (undraw.co).
    ">Attributions</p>
  </div>
</footer>
